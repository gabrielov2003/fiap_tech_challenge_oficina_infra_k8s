name: Ligar infra

on:
  workflow_dispatch:

concurrency:
  group: liga-desliga
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_ligado: "true"
  TF_VAR_region: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  cluster:
    runs-on: ubuntu-latest
    env:
      TF_VAR_datadog_api_key: ${{ secrets.DD_API_KEY }}
      TF_VAR_datadog_app_key: ${{ secrets.DD_APP_KEY }}
      TF_VAR_datadog_site: ${{ vars.DD_SITE || 'datadoghq.com' }}
      TF_VAR_datadog_alert_email: ${{ vars.DD_ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Marca a infra como ligada
        run: aws ssm put-parameter --name /oficina/infra/ligada --value true --type String --overwrite

      - name: Sobe a rede, o NAT Gateway, o cluster e os nós (dev e prod)
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=infra-k8s/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true"
          terraform apply -auto-approve -lock-timeout=15m -target=module.vpc -target=module.eks
          terraform apply -auto-approve -lock-timeout=15m

  banco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/fiap_tech_challenge_oficina_infra_database
          ref: main

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Sobe o RDS (schemas dev e prod)
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=infra-database/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true"
          terraform apply -auto-approve -lock-timeout=15m

  servicos:
    needs: [cluster, banco]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repositorio:
          - fiap_tech_challenge_oficina_api
          - fiap_tech_challenge_oficina_billing_service
          - fiap_tech_challenge_oficina_execution_service
        branch: [dev, main]
    steps:
      - uses: actions/checkout@v4

      - name: Deploy de ${{ matrix.repositorio }} pela branch ${{ matrix.branch }}
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Configure o secret GH_ACTIONS_TOKEN para disparar os pipelines dos serviços."
            exit 1
          fi
          bash .github/scripts/disparar_deploy.sh "${{ github.repository_owner }}/${{ matrix.repositorio }}" "${{ matrix.branch }}"

  lambda:
    needs: servicos
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: [dev, main]
    steps:
      - uses: actions/checkout@v4

      - name: Deploy da Lambda e do API Gateway pela branch ${{ matrix.branch }}
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_TOKEN }}
        run: bash .github/scripts/disparar_deploy.sh "${{ github.repository_owner }}/fiap_tech_challenge_oficina_auth_lambda" "${{ matrix.branch }}"
