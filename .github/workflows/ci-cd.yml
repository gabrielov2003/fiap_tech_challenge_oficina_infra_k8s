name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: |
          terraform init -backend=false
          terraform validate

  terraform:
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-${{ github.ref }}
      cancel-in-progress: false
    env:
      TF_VAR_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_datadog_api_key: ${{ secrets.DD_API_KEY }}
      TF_VAR_datadog_app_key: ${{ secrets.DD_APP_KEY }}
      TF_VAR_datadog_site: ${{ vars.DD_SITE || 'datadoghq.com' }}
      TF_VAR_datadog_alert_email: ${{ vars.DD_ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - name: Verifica credenciais AWS
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "Credenciais AWS não configuradas, etapas de plan e apply ignoradas."
            echo "SKIP_AWS=true" >> $GITHUB_ENV
          elif [ -z "${{ vars.TF_STATE_BUCKET }}" ]; then
            echo "::error::Configure a variável TF_STATE_BUCKET com o bucket S3 do estado do Terraform."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        if: env.SKIP_AWS != 'true'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        if: env.SKIP_AWS != 'true'

      - name: Terraform init
        if: env.SKIP_AWS != 'true'
        run: >-
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=infra-k8s/terraform.tfstate"
          -backend-config="region=${AWS_REGION}"
          -backend-config="use_lockfile=true"

      - name: Terraform plan
        if: env.SKIP_AWS != 'true' && !(github.event_name == 'push' && github.ref_name == 'main')
        run: terraform plan -lock-timeout=15m

      - name: Terraform apply
        if: env.SKIP_AWS != 'true' && github.event_name == 'push' && github.ref_name == 'main'
        run: |
          terraform apply -auto-approve -lock-timeout=15m -target=module.vpc -target=module.eks
          terraform apply -auto-approve -lock-timeout=15m
